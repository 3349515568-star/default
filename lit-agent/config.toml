# lit-agent 配置。改完直接保存即可，无需重启什么。

[search]
candidates = 30        # 每个排序维度各拉多少候选（relevance 一批 + 引用数一批，去重后合并）
min_year   = 2015      # 只看这一年及以后的文献（按需调小/调大）

# 在 LLM 打分和 PDF 下载前剔除。DOI 前缀通常比模糊期刊名更可靠。
# Frontiers 是用户指定策略；其余为有 FTC 法院案件记录的 OMICS 及关联出版网络。
# 不默认整个平台屏蔽 MDPI/Hindawi/SCIRP/Longdom，避免把争议对象当成已定性的欺诈集团。
[blacklist]
enabled = true
doi_prefixes = [
    "10.3389/",  # Frontiers（用户指定）
    "10.4172/",  # OMICS Publishing Group
    "10.36648/", # iMedPub / Insight Medical Publishing
    "10.35841/", # Allied Academies
    "10.37532/", # Trade Science / Pulsus 关联网络
]
publishers = [
    "Frontiers Media",
    "Frontiers",
    "OMICS Publishing Group",
    "OMICS International",
    "iMedPub",
    "Insight Medical Publishing",
    "Conference Series",
    "Allied Academies",
    "Pulsus Group",
    "Trade Science",
    "SciTechnol",
    "EuroSciCon",
]
journals = []
journal_prefixes = ["Frontiers in"]

[rank]
# 先硬性剔除 relevance < min_relevance，再对合格文献计算最终得分：
# w_relevance * (LLM相关度0-10) + w_citation * log10(引用数+1)
# + w_influential * log10(高影响引用数+1) + w_recency * 近年加分
w_relevance = 1.0
w_citation  = 0.6
w_influential = 0.2    # Semantic Scholar 高影响引用数加成（只在相关度同分时破局）
w_recency   = 0.3
min_relevance = 6.0     # 常规精读门槛；若当天零产出，limits.daily_min 可触发最高分兜底
verify_shortlist = true # 对初评达标文献做第二次严格复核，取两次较低分；全部入围时可接近多一轮打分 token
audit_min_candidates = 3 # 初评达标少于 3 篇时跳过二轮复核，避免为 1-2 篇低收益地多花 token
relevance_first = true  # 相关度绝对优先；引用数/新近度只排同相关度文献，避免高引低相关反超

[limits]
daily_min = 1          # 当天无达标文献时，从有效评分候选中兜底精读最高分 1 篇
daily_max = 10         # 每天最多精读/总结多少篇

[llm]
max_tokens  = 20000                    # 博士论文级精读需要较长输出；并为总结与展望预留截尾空间
temperature = 0.15                     # 文献精读建议 0.1-0.2，优先稳定和忠实原文；不建议高于 0.3
# 本工具用于低温精读整理，不要用 reasoning 模型（R1/QwQ/豆包思考版会过度延展，伤忠实度）

# 每个步骤用哪个 provider:model。改这里换默认；命令行 --summary-model / --score-model 可临时覆盖。
[models]
score            = "deepseek:deepseek-v4-flash" # 相关度筛选：非思考模式、严格硬门槛
summary_full     = "ofox:openai/gpt-5.6-luna"   # PDF 全文精读：默认 Luna Responses API
summary_abstract = "qwen:qwen-long-latest"      # 只有摘要时保留低成本 Qwen
review           = "ofox:openai/gpt-5.6-luna"   # 多篇系统综述属于终稿任务

# 各家 provider 的 OpenAI 兼容入口 + 对应 .env 里的 key 变量名。只有填了 key 的才可用。
# 自定义 provider（自己的中转/校园代理/OpenRouter 等）请写进 config.local.toml（git 已忽略），
# 格式与下面各段相同；[models] / [pricing*] 也可在同文件覆盖，互不影响他人。
[providers.deepseek]
base_url = "https://api.deepseek.com"
key_env  = "DEEPSEEK_API_KEY"
thinking = "disabled"                   # 文献相关度 JSON 打分不需要默认 high 思考模式
call_attempts = 1                        # _score_one_batch 自带一次可见重试，禁止再嵌套重发

[providers.qwen]                        # 阿里云通义千问（DashScope 兼容模式）
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
key_env  = "DASHSCOPE_API_KEY"

[providers.zhipu]                       # 智谱 GLM
base_url = "https://open.bigmodel.cn/api/paas/v4"
key_env  = "ZHIPUAI_API_KEY"

[providers.doubao]                      # 火山引擎豆包（方舟 Ark，model 用接入点 ep-id）
base_url = "https://ark.cn-beijing.volces.com/api/v3"
key_env  = "ARK_API_KEY"
# 已知接入点：Seed2.0-Pro=ep-m-20260525205826-brqxr（思考模型，精读偏浅，不推荐）；
#            Seed2.0-Lite=ep-m-20260603164650-wqfcv（快/便宜，可作打分备选）

[providers.relay302]                    # 302.ai 中转（可访问 Claude/GPT 等）
base_url = "https://api.302.ai/v1"
key_env  = "AI302_API_KEY"

[providers.ofox]                        # ofox.ai OpenAI 兼容中转；默认承载 Luna 全文精读
base_url = "https://api.ofox.ai/v1"
key_env  = "OFOX_API_KEY"
api_protocol = "responses"              # 长文使用结构化 response.* 事件，记录 response_id 便于断流诊断
stream = true                            # 长文必须流式接收，避免中转站整包响应长时间无数据
timeout_seconds = 180                    # 流式读取中连续 180 秒无新数据才超时
call_attempts = 1                        # 长文禁止自动重发，避免同一请求潜在重复计费
responses_store = false                  # Ofox 不支持按 response_id GET 恢复，不额外要求保存响应正文
recover_responses = false                # 实测 GET /responses/{id} 为 404；断流时保存 partial，绝不重发

[fulltext]
max_chars           = 300000   # 典型论文整篇一次输入；超出后才按 PDF 页分块，避免有损 map-reduce
prefer_repository   = true      # 下载 OA 时优先 repository 源（PMC/机构库/预印本，少被反爬）

# 浏览器导出的出版商 cookie 按 sessions/<publisher>.json|txt 分开存放。
# sessions/ 已被 git 忽略；只把 cookie 发往对应出版商域名。
[sessions]
cookie_dir = "sessions"

# 校园 EZproxy 等改写域名可按出版商显式加入；不要把一个代理域名全局共享。
[sessions.extra_domains]
# elsevier = ["publisher.proxy.example.edu"]

# MDPI 与 Elsevier 的特化可视化浏览器通道。profile 会持久保存登录、cookie、localStorage。
# Elsevier 有 API key 时先走服务端 Article Retrieval API，再用浏览器打开 ScienceDirect。
[publisher_browser]
enabled = true
publishers = ["elsevier", "mdpi"]
profile_dir = "browser_profiles"
headed = true
humanize = true
timeout_seconds = 90
interactive_wait_seconds = 120
proxy_env = "CLOAKBROWSER_PROXY"
# locale = "zh-CN"
# timezone = "Asia/Shanghai"

# ─── 模型单价参考（单位：元 / 百万 token）───
# 价格会变，以各平台官网为准。仅作选型对比参考。`py lit_agent.py cost` 用到此段。
#
[pricing]
"qwen-long-latest"      = [0.5, 2.0]    # 10M上下文，100万免费token
"qwen-long"             = [0.5, 2.0]    # 稳定版，无免费额度
"qwen-plus"             = [0.8, 4.8]    # 128K上下文，性价比优
"qwen-flash"            = [0.6, 2.0]    # 快/便宜，可作打分备选

# 美元计价模型。DeepSeek 从 2026-08-17 起工作日峰时价格翻倍；这里采用
# cache-miss 峰时上限，避免 cost 低估。非峰时实际为所列 DeepSeek 价格的一半，
# cache hit 输入还会更低。Ofox 中转价格仍以其 Dashboard 账单为准。
[pricing_usd]
"deepseek-v4-flash"    = [0.44, 1.32]   # 峰时上限；非峰时 $0.22 / $0.66
"deepseek-v4-pro"      = [1.32, 3.96]   # 峰时上限；非峰时 $0.66 / $1.98
"deepseek-chat"        = [0.44, 1.32]   # 旧别名，仅用于历史记录估算
"openai/gpt-5.6-luna"  = [0.2, 1.2]
"openai/gpt-5.6-terra" = [2.0, 12.0]
"openai/gpt-5.6-sol"   = [2.5, 15.0]

# ─── NCBI Entrez 检索 ───
# 需要 biopython。无需 NCBI_API_KEY 也能用（限速 3 req/s），有 key 提升到 10 req/s。
# 在 .env 里填 NCBI_API_KEY=（非必填）即可自动启用。
# discover --source ncbi 检索 PubMed；--source all 合并 EPMC + NCBI 两路。      
